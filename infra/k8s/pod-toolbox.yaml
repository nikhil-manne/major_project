apiVersion: v1
kind: Pod
metadata:
  name: redteam-toolbox
  namespace: sandbox-${SESSION_ID}
  labels:
    role: toolbox
    cyberrange.io/session-id: "${SESSION_ID}"
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: false
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: toolbox
      image: cyberrange/toolbox:latest
      # Launch ttyd web terminal wrapping bash recording to asciinema
      command:
        - "/bin/bash"
        - "-c"
        - "mkdir -p /workspace && if command -v ttyd >/dev/null 2>&1; then ttyd -p 7681 -W /bin/bash; else sleep 7200; fi"
      ports:
        - name: ttyd
          containerPort: 7681
          protocol: TCP
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
          add:
            - NET_RAW
      resources:
        limits:
          cpu: "1000m"
          memory: "1Gi"
        requests:
          cpu: "250m"
          memory: "512Mi"
      volumeMounts:
        - name: workspace
          mountPath: /workspace
  volumes:
    - name: workspace
      emptyDir: {}

