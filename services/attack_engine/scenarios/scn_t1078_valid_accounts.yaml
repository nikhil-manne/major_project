id: scn-cred-05
name: Valid Accounts Credential Access Probe
description: Automated credential validation against target services.
mitre_tactic: TA0005
mitre_technique: T1078
required_services: ["22", "ssh"]
steps:
  - step: 1
    action: "nc -z -v -w 3 {TARGET} 22"
    tool: "nc"
    delay_ms: 1000
    expected_output: "[22][ssh] Port connectivity verification completed"
  - step: 2
    action: "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=3 audit@{TARGET} whoami"
    tool: "ssh"
    delay_ms: 600
    expected_output: "Authentication probe completed against target endpoint"
