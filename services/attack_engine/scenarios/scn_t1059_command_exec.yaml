id: scn-sh-03
name: Command & Scripting Interpreter (Command Execution Probe)
description: Probes command execution behavior against the sandbox target.
mitre_tactic: TA0002
mitre_technique: T1059
required_services: []
steps:
  - step: 1
    action: "curl -s -m 5 http://{TARGET}:8080/"
    tool: "curl"
    delay_ms: 600
    expected_output: "HTTP 200 OK - Target web endpoint responsive"
  - step: 2
    action: "nmap -p 8080 --script http-methods {TARGET}"
    tool: "nmap"
    delay_ms: 400
    expected_output: "Supported Methods: GET, HEAD, POST, OPTIONS"
