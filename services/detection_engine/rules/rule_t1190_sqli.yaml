title: Exploit Public-Facing Application - SQL & Parameter Injection
id: rule-t1190-004
status: test
description: Detects automated SQL injection payloads, sqlmap probes, and parameter injections targeting HTTP parameters (T1190).
author: Blue Team
references:
  - https://attack.mitre.org/techniques/T1190/
tags:
  - attack.initial_access
  - attack.t1190
logsource:
  category: network
  product: suricata
detection:
  selection:
    action|contains:
      - "sqlmap"
      - "information_schema"
      - "UNION SELECT"
      - "users_vault"
      - "id=1'"
      - "+or+1=1"
      - "or 1=1"
      - "api/users?id="
      - "' or '"
      - "%27"
      - "multipart/form-data"
  condition: selection
falsepositives:
  - Database debugging utilities
level: high
